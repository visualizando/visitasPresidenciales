name: Validar

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest --cov=pipeline --cov-report=term-missing
      - run: uv run accesos build-web
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm build:curation
        working-directory: web
      - run: git diff --exit-code -- pipeline/curation_ui/static
      - run: cp -R public/data dist/data
        working-directory: web
      - run: node scripts/check-size.mjs
        working-directory: web
      - run: pnpm check:search
        working-directory: web
