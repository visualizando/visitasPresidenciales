name: Publicar GitHub Pages

on:
  workflow_run:
    workflows: ["Validar"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Restaurar datos web generados
        id: web-data
        uses: actions/cache@v4
        with:
          path: web/public/data
          key: web-data-v1-${{ runner.os }}-${{ hashFiles('data/partitions/**/*.parquet', 'data/manifest.json', 'data/curation/entity_merges.json', 'data/audiencias*.json', 'pipeline/**/*.py', 'schemas/**', 'pyproject.toml', 'uv.lock') }}
      - uses: astral-sh/setup-uv@v6
        if: steps.web-data.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras
        if: steps.web-data.outputs.cache-hit != 'true'
      - run: uv run accesos build-web
        if: steps.web-data.outputs.cache-hit != 'true'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: cp public/og.png public/favicon.ico public/favicon-16x16.png public/favicon-32x32.png public/apple-touch-icon.png public/android-chrome-192x192.png public/android-chrome-512x512.png public/site.webmanifest dist/
        working-directory: web
      - run: cp -R public/data dist/data
        working-directory: web
      - run: node scripts/check-size.mjs
        working-directory: web
      - run: pnpm check:search
        if: steps.web-data.outputs.cache-hit != 'true'
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
