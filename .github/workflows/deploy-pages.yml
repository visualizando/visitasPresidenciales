name: Publicar GitHub Pages

on:
  workflow_run:
    workflows: ["Validar"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Restaurar datos web generados
        id: web-data
        uses: actions/cache@v4
        with:
          path: web/public/data
          key: web-data-v1-${{ runner.os }}-${{ hashFiles('data/partitions/**/*.parquet', 'data/manifest.json', 'data/drive/state.json', 'data/curation/entity_merges.json', 'data/audiencias*.json', 'pipeline/**/*.py', 'schemas/**', 'pyproject.toml', 'uv.lock') }}
      - uses: astral-sh/setup-uv@v6
        if: steps.web-data.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras
        if: steps.web-data.outputs.cache-hit != 'true'
      - run: uv run accesos build-web
        if: steps.web-data.outputs.cache-hit != 'true'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: cp public/og.png public/favicon.ico public/favicon-16x16.png public/favicon-32x32.png public/apple-touch-icon.png public/android-chrome-192x192.png public/android-chrome-512x512.png public/site.webmanifest dist/
        working-directory: web
      - run: cp -R public/data dist/data
        working-directory: web
      - run: node scripts/check-size.mjs
        working-directory: web
      - run: pnpm check:search
        if: steps.web-data.outputs.cache-hit != 'true'
        working-directory: web
      - name: Evitar publicar una generación anterior
        id: current
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$(git rev-parse HEAD)" = "$latest" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "main avanzó; esta generación no reemplazará la publicación más reciente."
          fi
      - uses: actions/configure-pages@v5
        if: steps.current.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v3
        id: pages-artifact
        if: steps.current.outputs.publish == 'true'
        with:
          path: web/dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Esperar disponibilidad del artefacto de publicación
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          for attempt in $(seq 1 24); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" \
              --jq '.artifacts[] | select(.expired == false) | .id' | grep -Fxq "$ARTIFACT_ID"; then
              echo "Artefacto $ARTIFACT_ID disponible para publicar."
              exit 0
            fi
            echo "Esperando disponibilidad del artefacto ($attempt/24)..."
            sleep 5
          done
          echo "::error::GitHub no confirmó la disponibilidad del artefacto $ARTIFACT_ID."
          exit 1
      - id: deployment
        if: steps.current.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
